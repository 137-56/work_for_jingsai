# Streamlit 运行配置 —— 主要目的是让**截图/演示时界面干净**。
#
# toolbarMode = "minimal"：隐藏右上角的 Deploy 菜单与各类提示条
#   （否则截图里会出现 "Help agents write better apps" 弹窗，
#     演示与 PPT 里很难看）
# gatherUsageStats = false：关闭遥测上报

# ------------------------------------------------------------------ 主题
# ★ 必须显式指定 base = "light"，**不要依赖默认值**。
#   默认主题会跟随浏览器的 prefers-color-scheme，headless 截图时拿到的是
#   深色（背景 #0E1117）—— 深色截图放进白底的技术报告里很难看，
#   而且同一批截图会深浅混杂（实测踩到：01/03/09 深色，05/07 浅色）。
#   固定为浅色后，截图、演示、PPT 三处视觉一致。
#
# 配色与项目其它产出（溯源卡片 / 亲缘图 / 架构图）统一：
#   白底 + 羊皮纸侧栏 + 朱红强调 + 墨色文字。
[theme]
base = "light"
primaryColor = "#C8102E"                 # 项目主红（按钮 / 强调）
backgroundColor = "#FFFFFF"              # 主区白底
secondaryBackgroundColor = "#F7F1E6"     # 侧边栏与卡片：羊皮纸色
textColor = "#2B2318"                    # 墨色文字
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[server]
headless = true
# enableStaticServing：把应用目录下的 `static/` 挂到 URL `/app/static/` 下，
# 供浏览器直接访问。06 区的 Three.js 三维查看器必须靠它 ——
# 查看器是个**真实页面**，要能按相对路径取到 vendor/three.min.js 与 glb/*.glb。
# 若用 st.components.html(srcdoc) 则拿不到相对路径，页面会全白（实测踩到）。
# 默认值是 false，**不打开的话查看器会 404**。
#
# ★ 静态目录的位置是 **<app_dir>/static**（即 work/static/），
#   **不是** .streamlit/static/（曾踩过，找了两轮才定位）。
#   放错位置时唯一线索是启动日志里的
#   `WARNING: ... no static folder found at ...`，页面静默 404 白屏。
#   URL 前缀是 `/app/static/` —— 前导斜杠不能少，否则被当相对路径。
#   详见 文档/B8_3D交付说明.md 第四节。
enableStaticServing = true
