# 统一配置（模型名、阈值、路径）
# 原则：所有可调参数集中在这里，不要散落在代码里。

llm:
  provider: dashscope
  model: qwen-plus
  temperature: 0.2          # 需要稳定 JSON，必须低温
  max_retries: 3
  timeout: 30

clip:
  model_name: ViT-B-16      # 188M 参数，CPU 可跑
  device: cpu               # 有 GPU 就改 cuda
  batch_size: 16
  download_root: ./ckpt
  top_k: 10

validate:
  severity_order: [high, medium, low]
  min_confidence: 0.6

# 传统色板 —— 单一事实来源，三处共用：
#   ① src/m1_intent.py 的 prompt（限定 LLM 只能从板内选色）
#   ② rules/culture_rules.json 的 R021 / R022 的 allowed（由 scripts/check_rules.py 校验一致）
#   ③ M4 设计依据板的配色依据
# ⚠️ 色值须与所用传统色谱资料核对后再定稿。
# ⚠️ #FFFFFF / #000000 **刻意不在板内** —— 传统配色不用绝对黑白（须为墨、米白等有倾向的传统色），
#    规则 R025 正是据此禁止纯黑纯白主色。
traditional_palette:
  - { name: 正红, hex: "#C8102E" }
  - { name: 朱砂, hex: "#E34234" }
  - { name: 金色, hex: "#F2A900" }
  - { name: 浅金, hex: "#D4AF37" }
  - { name: 靛蓝, hex: "#1B4B8F" }
  - { name: 青绿, hex: "#2E8B57" }
  - { name: 赭石, hex: "#955539" }
  - { name: 墨黑, hex: "#2B2318" }
  - { name: 米白, hex: "#F7F1E6" }
  - { name: 藤黄, hex: "#E8C55C" }

compose:
  canvas_size: 1024
  dpi: 300
  border_ratio: 0.15        # 边饰占画布比例

copyright:
  phash_size: 8
  phash_highfreq: 4
  # ---- 以下阈值由 scripts/calibrate_m7.py 标定得出（2026-09-24）----
  # 标定方法：正例=库内图 4 种轻微改动变体(120)，负例=库内原图跨门类比对(30)
  #           选点准则 Youden J = TPR - FPR 最大
  # ⚠️ 负例仅 30 个，FPR=0 的 95% 置信上界约 9.5% —— 对外表述不可写成"误报率 0%"，
  #    应写"在 30 个负例上未出现误报"。测试集规模待扩充。
  # phash：曲线显示区分力有限（t=3 时 TPR 49%/FPR 0；t=4 时 FPR 直接飙到 40%）。
  #        所以 phash **只用于"极近"判定**，灰区不设档 —— 否则 40% 的正常图会被判 medium。
  #        灰区交给 CLIP：它的曲线在 0.87~0.90 之间才有意义。
  phash_threshold: 3
  phash_threshold_medium: 3      # 与 high 同值 = 不设 phash 灰区（见上）
  # clip：t=0.89~0.90 区间 J 最大（TPR 100%/FPR 0）。取 0.90 以留一点余量。
  clip_sim_threshold: 0.90
  clip_sim_threshold_medium: 0.87

paths:
  samples: data/samples.json
  rules: rules/culture_rules.json
  index: data/index
  outputs: outputs
