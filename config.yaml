# 统一配置（模型名、阈值、路径）
# 原则：所有可调参数集中在这里，不要散落在代码里。

llm:
  provider: dashscope
  model: qwen-plus
  temperature: 0.2          # 需要稳定 JSON，必须低温
  max_retries: 3
  timeout: 30

clip:
  model_name: ViT-B-16      # 188M 参数，CPU 可跑
  device: cpu               # 有 GPU 就改 cuda
  batch_size: 16
  download_root: ./ckpt
  top_k: 10

validate:
  severity_order: [high, medium, low]
  min_confidence: 0.6

# 传统色板 —— 单一事实来源，三处共用：
#   ① src/m1_intent.py 的 prompt（限定 LLM 只能从板内选色）
#   ② rules/culture_rules.json 的 R021 / R022 的 allowed（由 scripts/check_rules.py 校验一致）
#   ③ M4 设计依据板的配色依据
# ⚠️ 色值须与所用传统色谱资料核对后再定稿。
# ⚠️ #FFFFFF / #000000 **刻意不在板内** —— 传统配色不用绝对黑白（须为墨、米白等有倾向的传统色），
#    规则 R025 正是据此禁止纯黑纯白主色。
traditional_palette:
  - { name: 正红, hex: "#C8102E" }
  - { name: 朱砂, hex: "#E34234" }
  - { name: 金色, hex: "#F2A900" }
  - { name: 浅金, hex: "#D4AF37" }
  - { name: 靛蓝, hex: "#1B4B8F" }
  - { name: 青绿, hex: "#2E8B57" }
  - { name: 赭石, hex: "#955539" }
  - { name: 墨黑, hex: "#2B2318" }
  - { name: 米白, hex: "#F7F1E6" }
  - { name: 藤黄, hex: "#E8C55C" }

compose:
  canvas_size: 1024
  dpi: 300
  border_ratio: 0.15        # 边饰占画布比例

copyright:
  phash_size: 8
  phash_highfreq: 4
  phash_threshold: 6        # 汉明距离，<= 6 判为高度相似（需标定）
  clip_sim_threshold: 0.92  # 余弦相似度阈值，需标定，不能照抄

paths:
  samples: data/samples.json
  rules: rules/culture_rules.json
  index: data/index
  outputs: outputs
